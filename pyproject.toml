[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xiaokong"
version = "0.3.0"
description = "小控 - 你的专用课程助手（FastAPI 后端 + Flet 前端）"
requires-python = ">=3.11,<4.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "deepagents==0.7.28",
  "langchain-openai>=1.7,<2.0",
  "httpx==0.28.1",
  "flet==1.0.3",
  "flet-cli==1.0.3",
  "flet-desktop==1.0.3",
  "flet-audio==1.0.3",
  "flet-audio-recorder==1.0.3",
  "miniaudio==1.71",
  "numpy>=2.0",
  "markitdown[pdf,docx,pptx,xlsx,xls]==0.1.8",
]

[project.optional-dependencies]
packaging = ["pyinstaller==6.22.3"]

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend"]

[tool.flet]
org = "local.xiaokong"
product = "小控-你的专用课程助手"
company = "Local"

[tool.flet.app]
path = "."
module = "main.py"
